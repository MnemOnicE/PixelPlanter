<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pixel Planter Studio</title>
        <!-- Onboarding Driver -->
        <!-- FontAwesome for Icons (using CDN for simplicity/standard) -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <!-- Main Studio Styles -->
      <script type="module" crossorigin src="/assets/index-BpFLSOX1.js"></script>
      <link rel="stylesheet" crossorigin href="/assets/index-Cgg0URiM.css">
    </head>
    <body>
        <div id="app-container">
            <!-- LEFT SIDEBAR: GENERATORS & TOOLS -->
            <aside id="sidebar-left">
                <h3 class="collapsible"><i class="fa-solid fa-seedling"></i> Generator</h3>
                <div class="section-content">
                <div class="control-group">
                    <label for="generator-select">Algorithm</label>
                    <select id="generator-select"></select>
                </div>

                <div id="generator-params">
                    <!-- Dynamic Parameters injected here -->
                </div>

                <div class="control-group">
                    <label for="symmetry-select">Symmetry</label>
                    <select id="symmetry-select">
                        <option value="none">None</option>
                        <option value="vertical">Vertical</option>
                        <option value="horizontal">Horizontal</option>
                        <option value="quad">Quad</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="seed-input">Seed</label>
                    <div style="display: flex; gap: 5px">
                        <input type="text" id="seed-input" placeholder="Random" />
                        <button id="randomize-btn" class="secondary" title="Roll Dice">
                            <i class="fa-solid fa-dice"></i>
                        </button>
                    </div>
                </div>
                </div>

                <hr />

                <h3 class="collapsible"><i class="fa-solid fa-palette"></i> Style</h3>
                <div class="section-content">
                <div class="control-group">
                    <label for="palette-select">Palette</label>
                    <select id="palette-select"></select>
                    <div id="palette-swatches" class="palette-swatches" style="display:flex; gap:2px; margin-top:5px; flex-wrap:wrap;"></div>
                </div>

                <div class="control-group">
                    <label for="size-input">Grid Size</label>
                    <input type="number" id="size-input" value="32" min="8" max="128" />
                </div>

                <div class="control-group">
                    <label for="pixel-size-input">Pixel Scale</label>
                    <input type="number" id="pixel-size-input" value="10" min="1" max="50" />
                </div>
                </div>

                <hr />

                <h3 class="collapsible"><i class="fa-solid fa-paintbrush"></i> Tools</h3>
                <div class="section-content">
                <div class="control-group">
                    <div style="display: flex; gap: 5px; flex-wrap: wrap">
                        <!-- Tool Radios hidden visually, styled via labels if needed, but here we keep standard inputs for functionality -->
                        <label class="radio-btn"
                            ><input type="radio" id="tool-brush" name="tool" value="brush" checked /> Brush</label
                        >
                        <label class="radio-btn"
                            ><input type="radio" id="tool-eraser" name="tool" value="eraser" /> Eraser</label
                        >
                        <label class="radio-btn"
                            ><input type="radio" id="tool-fill" name="tool" value="fill" /> Fill</label
                        >
                    </div>
                </div>
                <div class="control-group">
                    <label for="brush-size">Size: <span id="brush-size-val">1</span></label>
                    <input type="range" id="brush-size" min="1" max="5" value="1" />
                </div>
                </div>

                <button id="generate-btn" style="margin-top: auto">REGENERATE (Space)</button>
            </aside>

            <!-- MAIN STAGE: CANVAS -->
            <main id="stage">
                <div id="canvas-container">
                    <!-- Canvas injected here -->
                </div>
            </main>

            <!-- RIGHT SIDEBAR: LAYERS & MODIFIERS -->
            <aside id="sidebar-right">
                <h3 class="collapsible"><i class="fa-solid fa-layer-group"></i> Layers</h3>
                <div class="section-content">
                <div id="layer-panel">
                    <div id="layer-list"></div>
                    <button id="add-layer-btn" class="secondary" style="margin-top: 10px">+ New Layer</button>
                </div>
                </div>

                <hr />

                <h3 class="collapsible"><i class="fa-solid fa-wand-magic-sparkles"></i> Modifiers</h3>
                <div class="section-content">
                <div
                    id="modifiers-container"
                    style="
                        max-height: 150px;
                        overflow-y: auto;
                        border: 1px solid var(--border);
                        padding: 5px;
                        margin-bottom: 10px;
                    "
                >
                    <!-- Modifiers injected here -->
                </div>
                <div id="modifier-params">
                    <!-- Modifier params injected here -->
                </div>
                </div>

                <hr />

                <h3 class="collapsible">Actions</h3>
                <div class="section-content">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px">
                    <button id="undo-btn" class="secondary"><i class="fa-solid fa-rotate-left"></i> Undo</button>
                    <button id="redo-btn" class="secondary"><i class="fa-solid fa-rotate-right"></i> Redo</button>
                </div>

                <button id="save-btn"><i class="fa-solid fa-download"></i> Save Image</button>
                <button id="export-json-btn" class="secondary" style="margin-top: 5px">Export JSON</button>
                <button id="export-svg-btn" class="secondary" style="margin-top: 5px">Export SVG</button>
                <button id="share-btn" class="secondary" style="margin-top: 5px">Share Link</button>

                <div style="display: flex; gap: 5px; margin-top: 10px">
                    <button id="show-presets-btn" class="secondary">Presets</button>
                    <button id="show-factory-btn" class="secondary">Factory</button>
                    <button id="show-tutorials-btn" class="secondary">Tutorials</button>
                </div>
                </div>

                <!-- Elements hidden in Studio mode but kept for compatibility or specific tools -->
                <button id="edit-patterns-btn" class="hidden">Edit Patterns</button>
                <input type="checkbox" id="mode-toggle" class="hidden" checked />
                <!-- Force "Advanced" mode logically -->
            </aside>

            <!-- MOBILE BOTTOM TOOLBAR -->
            <nav id="mobile-toolbar">
                <button class="toolbar-btn" id="toggle-left-sidebar">
                    <i class="fa-solid fa-sliders"></i>
                    <span>Settings</span>
                </button>
                <button class="toolbar-btn" id="generate-btn-mobile" style="color: var(--accent)">
                    <i class="fa-solid fa-play"></i>
                    <span>Run</span>
                </button>
                <button class="toolbar-btn" id="toggle-right-sidebar">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Layers</span>
                </button>
            </nav>
        </div>

        <!-- MODALS -->
        <div id="presets-modal" class="modal">
            <div class="modal-content">
                <span class="close-button" style="float: right; cursor: pointer; font-size: 1.5em">&times;</span>
                <h2>Presets</h2>
                <div
                    id="preset-gallery"
                    style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px"
                ></div>
            </div>
        </div>

        <div id="tutorials-modal" class="modal">
            <div class="modal-content">
                <span class="close-button" style="float: right; cursor: pointer; font-size: 1.5em">&times;</span>
                <h2>Tutorials</h2>
                <div
                    id="tutorial-gallery"
                    style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px"
                ></div>
            </div>
        </div>

        <div id="factory-modal" class="modal">
            <div class="modal-content">
                <span class="close-button" style="float: right; cursor: pointer; font-size: 1.5em">&times;</span>
                <h2>Asset Factory</h2>
                <div class="control-group"><label>Rows</label><input type="number" id="factory-rows" value="4" /></div>
                <div class="control-group"><label>Cols</label><input type="number" id="factory-cols" value="4" /></div>
                <div class="control-group">
                    <label>Padding</label><input type="number" id="factory-padding" value="2" />
                </div>
                <div class="control-group">
                    <label>Variance</label><input type="range" id="factory-variance" min="0" max="100" value="20" />
                </div>
                <button id="factory-generate-btn">Download Sheet</button>
            </div>
        </div>

    </body>
</html>
